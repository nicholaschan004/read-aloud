<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Question Helper</title>
  <link rel="stylesheet" href="/src/style.css">
</head>
<body>

  <video id="video" autoplay playsinline muted></video>
  <canvas id="canvas" style="display:none"></canvas>
  <div id="flash"></div>

  <!-- iOS requires a real tap before any audio will play. This screen provides that. -->
  <div id="start-screen">
    <div id="start-content">
      <div id="start-icon">👂</div>
      <p>Tap anywhere to start</p>
    </div>
  </div>

  <div id="overlay">

    <div id="status-bar">
      <span id="status-dot"></span>
      <span id="status-text">Starting camera…</span>
    </div>

    <div id="countdown" class="hidden"></div>

    <div id="answer-card" class="hidden">
      <p id="answer-text"></p>
    </div>

  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
